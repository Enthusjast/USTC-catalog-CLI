name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.2.2
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1

      - name: Show release toolchain versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Verify package
        run: npm run check && npm run mcp:smoke && npm run package:smoke

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public
